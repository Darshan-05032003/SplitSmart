// Compose compiler stability configuration (see composeCompiler in build.gradle.kts).
// java.time types are immutable value types by the JDK's contract, but the compiler cannot see that in a Java library and
// infers them unstable. Group, Bill, Settlement and the history timeline all hold an Instant or a YearMonth.
java.time.*
// DateTimeFormatter is immutable and thread-safe by contract; the history's sticky month headers take one.
java.time.format.DateTimeFormatter
